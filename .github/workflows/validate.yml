name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      # Run on stage pushes too: stage is a protected branch and feeds
      # stage -> main PRs. Without this, commits squash-merged onto stage
      # never produced the required "validate" check for the stage->main PR
      # (see docs/DEPLOYMENT.md, "Stage branch and stage -> main merges").
      - stage

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build production application
        run: npm run build
